  <text x="16" y="168" font-size="13" fill="#9399b2" xml:space="preserve">       1. source: budget_2026.md</text>
  <text x="16" y="186" font-size="13" fill="#9399b2" xml:space="preserve">       &lt;&lt;&lt;BEGIN DOCUMENT DATA&gt;&gt;&gt;</text>
  <text x="16" y="204" font-size="13" fill="#9399b2" xml:space="preserve">       ...-station data and telemetry, annual | 37.20 |</text>
  <text x="16" y="222" font-size="13" fill="#9399b2" xml:space="preserve">       The per-station figure of 37.20 is charged for every active station in the</text>
  <text x="16" y="240" font-size="13" fill="#9399b2" xml:space="preserve">       network. The station count itself is not recorded in this file; the per-region</text>
  <text x="16" y="258" font-size="13" fill="#9399b2" xml:space="preserve">       counts and the network total are in deployment_log.txt and harbor_overview.md.</text>
