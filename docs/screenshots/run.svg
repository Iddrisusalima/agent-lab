  <text x="16" y="402" font-size="13" font-weight="bold" fill="#cba6f7" xml:space="preserve">Final answer:</text>
  <text x="16" y="420" font-size="13" fill="#cdd6f4" xml:space="preserve">The annual per-station telemetry charge is $37.20 per station (budget_2026.md).</text>
  <text x="16" y="438" font-size="13" fill="#cdd6f4" xml:space="preserve">Project Harbor has 62 active stations (harbor_overview.md).</text>
  <text x="16" y="456" font-size="13" fill="#cdd6f4" xml:space="preserve">Total annual telemetry charge for the whole harbor:</text>
  <text x="16" y="474" font-size="13" fill="#cdd6f4" xml:space="preserve">$37.20 x 62 = $2,306.40.</text>
