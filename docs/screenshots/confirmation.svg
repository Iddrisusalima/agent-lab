  <text x="16" y="222" font-size="13" font-weight="bold" fill="#f38ba8" xml:space="preserve">Append this text? Type y to approve, anything else declines: y</text>
  <text x="16" y="258" font-size="13" fill="#9399b2" xml:space="preserve">  [ok] Note approved by the operator and appended to notes.md: 68 characters were</text>
